services:
  app:
    build: .
    container_name: upp_app
    restart: unless-stopped
    environment:
      - APP_PREFIX=/TCC
      - UPP_DB_PATH=/data/dados.db
      - TZ=America/Sao_Paulo
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:
