services:
  app:
    # `UPP_IMAGE` aponta para uma imagem JA CONSTRUIDA E JA TESTADA, publicada
    # pelo CI com tag imutavel por SHA de commit.
    #
    # O deploy era `git pull && docker compose up --build` na VM, entao a imagem
    # que o CI testava nunca era a que rodava: a VM reconstruia a dela, com
    # outra data, outro cache de camadas e outras versoes resolvidas de
    # dependencia nao fixada. O CI verde nao dizia nada sobre o que estava no ar.
    #
    # Em producao:
    #   UPP_IMAGE=ghcr.io/yaguts1/tcc2-agente-inteligente:sha-abc123def456
    #   docker compose pull app && docker compose up -d app
    #
    # Sem a variavel, o comportamento local nao muda: `build: .` segue valendo e
    # `docker compose up --build` constroi como sempre.
    #
    # Use a tag por SHA, nunca `:main`. `main` e um alvo movel — "qual main?"
    # nao tem resposta depois do proximo push, e e justamente a ambiguidade que
    # a publicacao com tag imutavel resolve.
    image: ${UPP_IMAGE:-upp-app:local}
    build: .
    container_name: upp_app
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - APP_PREFIX=/TCC
      - UPP_DB_PATH=/data/dados.db
      - UPP_BACKUP_DIR=/data/backups
      - TZ=America/Sao_Paulo
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no seu .env antes de subir}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - UPP_ADMIN_PASS=${UPP_ADMIN_PASS:-}
      - UPP_ADMIN_TOKEN=${UPP_ADMIN_TOKEN:-}
      # Estavam documentados no .env.example e NAO chegavam ao container: quem
      # preenchesse o .env acreditaria ter ligado a autenticacao dos ESP32 e a
      # assinatura da trilha de auditoria, e as duas seguiriam desligadas, com
      # o aviso de startup passando por ruido.
      - UPP_DEVICE_TOKEN=${UPP_DEVICE_TOKEN:-}
      # Estado compartilhado entre replicas. VAZIO = tudo em processo, que e o
      # comportamento historico e continua valendo para instalacao de uma
      # instancia so. Com valor, o dedup e o buffer de reordenacao passam a
      # viver no Redis — ver `quality/filtro.py`.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - BRADEN_REAVALIACAO_HORAS=${BRADEN_REAVALIACAO_HORAS:-}
      - UPP_AUDIT_KEY=${UPP_AUDIT_KEY:-}
      # O mesmo defeito das duas acima valia para TODAS as de ajuste abaixo:
      # documentadas no .env.example, lidas pelo codigo e nunca repassadas ao
      # container. Quem preenchesse BACKUP_INTERVAL_HOURS=6 continuaria com 24,
      # quem ajustasse MONITORAMENTO_LIMITE_MIN nao mudaria nada, e a retencao
      # da auditoria jamais rodaria — tudo em silencio, porque o default existe
      # e funciona. Foi corrigido para duas variaveis e o resto ficou.
      # `tests/test_configuracao_chega_ao_container.py` impede a proxima.
      # `:-admin` e nao `:-`: o codigo usa "admin" como default, e mandar
      # string vazia trocaria o default por "", que nao casa com usuario algum.
      - UPP_ADMIN_USER=${UPP_ADMIN_USER:-admin}
      - UPP_REGISTER_TOKEN=${UPP_REGISTER_TOKEN:-}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-}
      - BACKUP_REPLICACAO_INTERVALO_HORAS=${BACKUP_REPLICACAO_INTERVALO_HORAS:-}
      - HOUSEKEEPING_INTERVAL_HOURS=${HOUSEKEEPING_INTERVAL_HOURS:-}
      - AUDITORIA_RETENCAO_DIAS=${AUDITORIA_RETENCAO_DIAS:-}
      - API_RATE_LIMIT_POR_MINUTO=${API_RATE_LIMIT_POR_MINUTO:-}
      - MONITORAMENTO_LIMITE_MIN=${MONITORAMENTO_LIMITE_MIN:-}
      - MONITORAMENTO_CHECK_INTERVAL=${MONITORAMENTO_CHECK_INTERVAL:-}
      - DEVICE_RECONCILE_INTERVAL=${DEVICE_RECONCILE_INTERVAL:-}
      # Idem: o default real e `estado_em_memoria`.
      - PROCESSADOR_ESTRATEGIA=${PROCESSADOR_ESTRATEGIA:-estado_em_memoria}
      # Web Push. Sem estas o aviso so toca com a aba aberta — e
      # `tests/test_configuracao_chega_ao_container.py` existe justamente para
      # impedir que uma variavel documentada no .env.example nao chegue aqui.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - PUSH_CHECK_INTERVAL=${PUSH_CHECK_INTERVAL:-}
    # 127.0.0.1, e nao 0.0.0.0.
    #
    # Publicada na LAN, esta porta ANULAVA o proxy inteiro. O `Caddyfile` bloqueia
    # `/metrics` com uma justificativa correta — inteligencia operacional sobre
    # uma unidade de saude, servida sem autenticacao —, e quem falasse direto na
    # 8000 recebia 200. Verificado no container: `/TCC/metrics`, `/docs` e
    # `/openapi.json` respondiam todos 200 por fora do Caddy.
    #
    # Pior, o rate limit: `_redes_confiaveis()` aceita `X-Forwarded-For` de rede
    # privada, o que e correto ATRAS de um proxy. Falando direto na 8000, o
    # cliente da LAN E o peer — e forja o cabecalho para rotacionar o balde.
    #
    # A mitigacao anterior era "abra so 80/443 no firewall", documentada no guia
    # de deploy. Isso e uma checkbox humana defendendo tres controles tecnicos.
    # Em loopback o debug local continua funcionando e a LAN nao alcanca.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Proxy reverso com HTTPS automatico (Let's Encrypt). Em desenvolvimento
  # local, acesse via http://localhost (a porta 8000 do app continua
  # publicada acima só para debug direto). Em produção, aponte o DNS do seu
  # domínio para a VM, defina DOMAIN=seudominio.com no .env, e abra só as
  # portas 80/443 no firewall (não a 8000) — ver GUIA_BUILD_DEPLOYMENT.md.
  # Estado que precisa ser COMPARTILHADO entre replicas.
  #
  # O dedup e o buffer de reordenacao do filtro viviam em dicionarios de modulo:
  # com duas instancias, cada uma reordenaria metade das amostras contra a
  # propria janela — e o buffer existe justamente para corrigir chegada fora de
  # ordem. Em processo, subir uma replica silenciosamente desliga essa correcao.
  #
  # `appendonly` ligado: perder o dedup num restart significa reprocessar
  # amostra que ja entrou (inofensivo, a PK da grade recusa) mas perder o BUFFER
  # significa perder amostra que ainda nao foi gravada.
  redis:
    image: redis:7-alpine
    container_name: upp_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # 127.0.0.1 e nao 0.0.0.0. A aplicacao fala com o Redis pela rede interna do
    # compose e nao precisa de porta publicada; isto existe para a suite de
    # paridade (`tests/test_estado_do_filtro.py`) alcancar o servidor a partir da
    # maquina. Este Redis nao tem senha — publicado na LAN, qualquer um leria e
    # apagaria o buffer de amostras ainda nao gravadas.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: upp_caddy
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  # Prometheus e Alertmanager NAO ficam atras de um profile.
  #
  # Um profile opcional reproduziria exatamente o problema que estes dois vem
  # resolver: `/metrics` existia desde sempre e ninguem raspava. Monitoramento
  # que so sobe quando alguem lembra de pedir e monitoramento que nao existe.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: upp_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 90 dias: o suficiente para o relatorio gerencial olhar para tras uma
      # temporada inteira, e barato num volume local.
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/regras_alertas.yml:/etc/prometheus/regras_alertas.yml:ro
      - prometheus_data:/prometheus
    # SEM `ports`. A UI do Prometheus expoe contagem de pacientes e volume de
    # alertas da instalacao; publicar a porta na VM a deixaria acessivel a quem
    # alcance o IP. Quem precisar olhar usa tunel SSH:
    #   ssh -L 9090:localhost:9090 usuario@vm  (e entao localhost:9090)
    expose:
      - "9090"
    depends_on:
      app:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: upp_alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    expose:
      - "9093"

volumes:
  app_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
