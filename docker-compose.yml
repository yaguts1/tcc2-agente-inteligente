version: "3.9"

services:
  app:

    build: .
    environment:
      - MODE=stream
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:

    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:

    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:

    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
