name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A aplicação assume o fuso do hospital (America/Sao_Paulo) em vários pontos
      # que usam datetime.now() sem timezone explícito. Fixamos o TZ do runner
      # para casar com o ambiente real de produção.
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show files (debug)
        run: |
          pwd
          ls -la
          if [ -f requirements.txt ]; then echo "=== requirements.txt ==="; cat requirements.txt; fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Run tests (com cobertura)
        # Cobertura só para visibilidade — sem gate por ora (ver plano P2). O
        # resumo term-missing aparece no log do job.
        run: >-
          pytest -q
          --cov=interface --cov=nucleo --cov=modulo_alerta --cov=servicos
          --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

  lint:
    # Lint advisory: NÃO bloqueia o merge (continue-on-error). Dá visibilidade
    # às violações de ruff enquanto a limpeza é feita aos poucos (plano P3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Ruff check (não-bloqueante)
        continue-on-error: true
        run: ruff check --output-format=concise .

  audit:
    # Auditoria de dependências advisory: NÃO bloqueia o merge por ora (plano
    # P3). Serve para enxergar CVEs conhecidos em deps Python e npm.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip-audit (não-bloqueante)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (não-bloqueante)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t upp-app:ci .
