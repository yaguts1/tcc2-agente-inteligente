name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      # `fix/**` ficava de fora: um push numa branch de correção só passava
      # pela CI quando (e se) alguém abrisse o PR. Como as correções é que
      # mexem em código já em uso, era justamente onde o retorno rápido faz
      # mais falta.
      - 'fix/**'
  pull_request:
    branches:
      - main

# Uma execucao por referencia. Sem isto, cada push numa branch com PR aberto
# disparava DOIS runs completos (o gatilho de push e o de pull_request), e uma
# sequencia de pushes deixava runs obsoletos ocupando a fila ate terminarem —
# gastando minutos para responder sobre um commit que ninguem mais vai olhar.
# `cancel-in-progress` mantem so o mais recente de cada referencia.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # O runner roda no mesmo fuso do ambiente real (America/Sao_Paulo), que é
      # o que o container usa. Isso não é cosmético: os testes de fuso
      # (tests/test_timezone_utc.py) só conseguem distinguir UTC de hora local
      # quando o fuso é diferente de UTC — sob TZ=UTC eles passariam mesmo com
      # o bug de `utc_now_iso()` gravando hora local.
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Run tests (com cobertura)
        # Cobertura só para visibilidade — sem gate por ora (ver plano P2). O
        # resumo term-missing aparece no log do job.
        run: >-
          pytest -q
          --cov=interface --cov=nucleo --cov=modulo_alerta --cov=servicos
          --cov-report=term-missing

  firmware:
    # O firmware era a unica parte do sistema sem verificacao no fluxo: nao
    # havia toolchain, entao mudancas iam para o repositorio sem nunca terem
    # passado por um compilador. Foi assim que o sketch chegou a um estado em
    # que NAO COMPILAVA (dois .ino na mesma pasta, com setup() e loop()
    # duplicados) sem que nada acusasse.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # O toolchain do ESP32 tem centenas de MB e nao muda entre execucoes.
      - name: Cache do PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Instalar PlatformIO
        run: pip install --quiet platformio

      # Testes da logica pura (classificacao de resposta, backoff, timestamp),
      # rodando na maquina — sem ESP32. E a parte com regra de negocio, e era a
      # parte sem teste nenhum.
      - name: Testes da logica do firmware
        run: pio test -d firmware -e nativo

      # As DUAS variantes, a cada push. Era exatamente a divergencia entre elas
      # que deixou a versao recomendada cinco correcoes atras da outra.
      - name: Compilar firmware (HTTP e WebSocket)
        run: pio run -d firmware

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

  lint:
    # Lint BLOQUEANTE. Era advisory (continue-on-error) desde o início, com a
    # justificativa de "limpar aos poucos" — o que na prática significa nunca:
    # o número de violações só cresce e o job vira ruído que ninguém lê.
    # A base foi zerada (161 -> 0), então o gate agora só impede regressão.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Ruff check
        run: ruff check --output-format=concise .

  audit:
    # Auditoria de dependências advisory: NÃO bloqueia o merge por ora (plano
    # P3). Serve para enxergar CVEs conhecidos em deps Python e npm.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pip-audit (não-bloqueante)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (não-bloqueante)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t upp-app:ci .

      # O job só construía a imagem e parava aí: um container que respondesse
      # 404 em todas as rotas passaria. Aqui ele é de fato executado, com a
      # mesma configuração do docker-compose (APP_PREFIX=/TCC), e as rotas são
      # exercitadas — inclusive a exigência de autenticação.
      - name: Smoke test da imagem
        run: |
          set -euo pipefail
          docker run -d --name upp_ci -p 8000:8000 \
            -e ENVIRONMENT=production \
            -e APP_PREFIX=/TCC \
            -e JWT_SECRET_KEY=chave-de-ci-nao-usar-em-producao \
            -e UPP_DB_PATH=/data/dados.db \
            -e TZ=America/Sao_Paulo \
            upp-app:ci

          echo "Aguardando o container ficar saudável..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "healthz OK (tentativa $i)"; break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::container não respondeu em /healthz"
              docker logs upp_ci
              exit 1
            fi
            sleep 2
          done

          verificar() {
            local descricao="$1" url="$2" esperado="$3"
            local codigo
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$codigo" != "$esperado" ]; then
              echo "::error::$descricao: esperado $esperado, veio $codigo ($url)"
              docker logs upp_ci
              exit 1
            fi
            echo "OK  $descricao -> $codigo"
          }

          # A SPA precisa estar sendo servida sob o prefixo (o build do frontend
          # entra na imagem no estágio 1 do Dockerfile).
          verificar "SPA sob o prefixo"        http://localhost:8000/TCC/            200
          # Dados clínicos exigem sessão.
          verificar "API exige autenticação"   http://localhost:8000/TCC/api/pacientes 401
          # Sem o prefixo a API não existe.
          verificar "API fora do prefixo"      http://localhost:8000/api/pacientes     404

      - name: Logs do container (em caso de falha)
        if: failure()
        run: docker logs upp_ci || true

      - name: Encerrar container
        if: always()
        run: docker rm -f upp_ci || true
