{% if events %}
  <div class="timeline-bar">
    {% for e in events %}
      <div
        class="segment status-{{ e.status }}"
        style="left: {{ e.start_pct }}%; width: {{ e.width_pct }}%;"
        title="{{ e.tooltip }}"
      ></div>
    {% endfor %}
    <div id="timeline-bar" class="timeline-bar-inner" data-min-ms="{{ min_ms }}" data-max-ms="{{ max_ms }}">
      <div class="cursor" id="timeline-cursor" style="left: {{ cursor_pct }}%"></div>
    </div>
  </div>
  <div class="timeline-legend">
    <small>{{ window_start }} → {{ window_end }}</small>
  </div>
{% else %}
  <div class="timeline-legend">
    <small>Nenhum evento na janela selecionada.</small>
  </div>
{% endif %}
<script>
  (function () {
    const bar = document.getElementById('timeline-bar');
    if (!bar) return;
    const cursor = document.getElementById('timeline-cursor');
    const minMs = parseInt(bar.dataset.minMs, 10);
    const maxMs = parseInt(bar.dataset.maxMs, 10);
    const range = Math.max(1, maxMs - minMs);
    const nowHidden = document.getElementById('now');
    const pidSelect = document.getElementById('pid');

    const pxToPct = (clientX) => {
      const rect = bar.getBoundingClientRect();
      const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
      return (x / rect.width) * 100.0;
    };

    const pctToMs = (pct) => Math.round(minMs + (pct / 100.0) * range);
    const toIsoNoMillis = (ms) => new Date(ms).toISOString().slice(0,19);

    const recordSeek = async (ts_ms, paciente_id) => {
      try {
        const body = { ts_ms: ts_ms, tipo: 'manual_seek' };
        if (paciente_id) body.paciente_id = paciente_id;
        await fetch('/api/timeline/record', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      } catch (err) {
        // ignore network errors for now
      }
    };

    const updateCursor = (pct) => {
      if (cursor) cursor.style.left = pct + '%';
    };

    // Click-to-seek (quick single clicks)
    bar.addEventListener('click', function (ev) {
      if (ev.button !== 0) return; // only left click
      const pct = pxToPct(ev.clientX);
      const targetMs = pctToMs(pct);
      const iso = toIsoNoMillis(targetMs);
      if (nowHidden) nowHidden.value = iso;
      updateCursor(pct);
      // refresh UI once per action
      htmx.trigger(document.getElementById('timeline'), 'refresh');
      htmx.trigger(document.getElementById('tbody-alertas'), 'refresh');
      void recordSeek(targetMs, pidSelect ? pidSelect.value || null : null);
    });

    // Drag-to-scrub (mousedown + move)
    let dragging = false;
    const onMove = (clientX) => {
      const pct = pxToPct(clientX);
      const targetMs = pctToMs(pct);
      const iso = toIsoNoMillis(targetMs);
      if (nowHidden) nowHidden.value = iso;
      updateCursor(pct);
    };

    const onMouseMove = (ev) => {
      onMove(ev.clientX);
      ev.preventDefault();
    };

    const onMouseUp = (ev) => {
      if (!dragging) return;
      dragging = false;
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
      const pct = pxToPct(ev.clientX);
      const targetMs = pctToMs(pct);
      const iso = toIsoNoMillis(targetMs);
      if (nowHidden) nowHidden.value = iso;
      htmx.trigger(document.getElementById('timeline'), 'refresh');
      htmx.trigger(document.getElementById('tbody-alertas'), 'refresh');
      void recordSeek(targetMs, pidSelect ? pidSelect.value || null : null);
    };

    bar.addEventListener('mousedown', function (ev) {
      if (ev.button !== 0) return;
      dragging = true;
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
      ev.preventDefault();
    });

    // Touch support
    bar.addEventListener('touchstart', function (ev) {
      dragging = true;
      ev.preventDefault();
    }, { passive: false });
    bar.addEventListener('touchmove', function (ev) {
      if (!dragging) return;
      const touch = ev.touches[0];
      onMove(touch.clientX);
      ev.preventDefault();
    }, { passive: false });
    bar.addEventListener('touchend', function (ev) {
      if (!dragging) return;
      dragging = false;
      const lastTouch = ev.changedTouches && ev.changedTouches[0];
      const clientX = lastTouch ? lastTouch.clientX : (ev.clientX || 0);
      const pct = pxToPct(clientX);
      const targetMs = pctToMs(pct);
      const iso = toIsoNoMillis(targetMs);
      if (nowHidden) nowHidden.value = iso;
      htmx.trigger(document.getElementById('timeline'), 'refresh');
      htmx.trigger(document.getElementById('tbody-alertas'), 'refresh');
      void recordSeek(targetMs, pidSelect ? pidSelect.value || null : null);
    });
  })();
</script>
