<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Monitor de Alertas UPP</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
      th { background: #f0f0f0; }
      tr.status-aberto { background: #fff6cc; }
      tr.status-reconhecido { background: #e0f0ff; }
      tr.status-fechado { background: #f5f5f5; }
      button { margin-right: 0.25rem; }
      .controls { margin-bottom: 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
      .timeline-bar { position: relative; height: 10px; background: #eee; border-radius: 6px; margin-bottom: 0.5rem; }
      .timeline-bar .segment { position: absolute; top: 0; height: 100%; border-radius: 6px; opacity: 0.8; }
      .timeline-bar .segment.status-aberto { background: #ffc107; }
      .timeline-bar .segment.status-reconhecido { background: #4da3ff; }
      .timeline-bar .segment.status-fechado { background: #9e9e9e; }
      .timeline-bar .cursor { position: absolute; top: -4px; width: 2px; height: 18px; background: #111; transform: translateX(-1px); }
      .timeline-legend { font-size: 0.85rem; color: #555; }
    </style>
  </head>
  <body>
    <h1>Alertas em Monitoramento</h1>


    <div class="controls">
      <label for="rate">
        Velocidade:
        <span id="rateLabel">{{ rate or 10 }}x</span>
        - Agora: <span id="nowLabel">{{ (now or '')|replace('T',' ') }}</span>
      </label>
      <input type="range" id="rate" name="rate" min="1" max="60" value="{{ rate or 10 }}" />
      <label for="pid">Paciente:</label>
      <select
        id="pid"
        name="pid"
        hx-get="/partials/alertas"
        hx-target="#tbody-alertas"
        hx-trigger="change"
        hx-include="#now,#pid,#horas,#rate"
        hx-on::afterRequest="htmx.trigger('#timeline','refresh')"
      >
        <option value="">Todos</option>
        {% for p in pacientes %}
          <option value="{{ p }}" {% if pid == p %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select>
      <input type="hidden" id="now" name="now" value="{{ now or '' }}" />
      <input type="hidden" id="horas" name="horas" value="{{ horas if horas is not none else '' }}" />
    </div>

    <div
      id="timeline"
      hx-get="/partials/timeline"
      hx-trigger="load, every 2s, refresh"
      hx-swap="innerHTML"
      hx-include="#now,#pid,#horas,#rate"
    ></div>

    <table>
      <thead>
        <tr>
          <th>Paciente</th>
          <th>Inicio</th>
          <th>Fim</th>
          <th>Tempo Decorrido (min)</th>
          <th>Status</th>
          <th>Perfil</th>
          <th>Janela (min)</th>
          <th>Duracao (min)</th>
          <th>Acoes</th>
        </tr>
      </thead>
      <tbody
        id="tbody-alertas"
        hx-get="/partials/alertas"
        hx-trigger="load, every 2s, refresh"
        hx-swap="innerHTML"
        hx-include="#now,#pid,#horas,#rate"
      >
        {% include 'partials/alertas_rows.html' %}
      </tbody>
    </table>

    <script>
      (function () {
        const rateInput = document.getElementById('rate');
        const rateLabel = document.getElementById('rateLabel');
        const nowHidden = document.getElementById('now');
        const nowLabel = document.getElementById('nowLabel');

        const serverNow = (nowHidden.value || '{{ now or "" }}').slice(0, 19);
        const parseIso = (value) => (value ? new Date(`${value}Z`) : new Date());

        let t0Virt = parseIso(serverNow);
        let t0Real = Date.now();

        const isoNoMillis = (date) => date.toISOString().slice(0, 19);

        rateInput.addEventListener('input', () => {
          t0Virt = parseIso(nowHidden.value || isoNoMillis(new Date()));
          t0Real = Date.now();
        });

        const tick = () => {
          const rate = parseInt(rateInput.value || '1', 10);
          const elapsed = (Date.now() - t0Real) / 1000;
          const virt = new Date(t0Virt.getTime() + elapsed * 1000 * rate);
          const iso = isoNoMillis(virt);
          rateLabel.textContent = `${rate}×`;
          nowHidden.value = iso;
          nowLabel.textContent = iso.replace('T', ' ');
          requestAnimationFrame(tick);
        };

        tick();
      })();
    </script>
  </body>
</html>
