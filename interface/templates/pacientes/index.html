<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Fichas de Pacientes</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: #f9fafb; color: #222; }
      h1 { margin-bottom: 1.5rem; }
      .layout { display: grid; grid-template-columns: 40% 1fr; gap: 1.5rem; align-items: start; }
      .panel { background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 0 12px rgba(0,0,0,0.05); }
      .panel h2 { margin-top: 0; }
      .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: 1rem; }
      button { background: #286090; color: #fff; border: none; border-radius: 4px; padding: 0.5rem 1rem; cursor: pointer; }
      button.secondary { background: #e0e0e0; color: #222; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #e3e6eb; text-align: left; }
      tbody tr:hover { background: #eef3ff; }
      tr.paciente-row { cursor: pointer; }
      fieldset { border: 1px solid #d7dbe2; border-radius: 6px; padding: 0.75rem; margin-top: 1rem; }
      fieldset legend { font-weight: 600; padding: 0 0.5rem; }
      .paciente-form-fields label { display: block; font-weight: 600; margin-top: 0.75rem; }
      .paciente-form-fields input[type="text"], .paciente-form-fields select, .paciente-form-fields textarea { width: 100%; margin-top: 0.35rem; padding: 0.5rem; border: 1px solid #ccd2da; border-radius: 4px; box-sizing: border-box; }
      .alert { padding: 0.6rem 0.8rem; border-radius: 4px; margin-bottom: 0.75rem; }
      .alert.error { background: #fbe9e7; color: #c62828; }
      .alert.success { background: #e5f7ed; color: #256029; }
      .form-actions { display: flex; gap: 0.5rem; align-items: center; margin-top: 1rem; }
      .checkbox { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
      .rotinas-atual table { margin-top: 0.75rem; }
      .hint { color: #555; font-size: 0.9rem; }
      .rotinas-pessoais { margin-top: 1.5rem; }
      .rotinas-editor-table input[type="text"], .rotinas-editor-table input[type="time"], .rotinas-editor-table input[type="number"] { width: 100%; box-sizing: border-box; padding: 0.35rem; border: 1px solid #ccd2da; border-radius: 4px; }
      .rotinas-editor-table th, .rotinas-editor-table td { vertical-align: middle; }
      .rotinas-editor-table td.center { text-align: center; }
      .rotinas-editor-table td.controls { text-align: right; }
      .rotinas-editor-table .toggle { display: inline-flex; align-items: center; gap: 0.35rem; }
      .rotinas-editor-table .toggle span { font-size: 0.85rem; color: #444; }
      .rotina-placeholder td { text-align: center; font-style: italic; color: #6b7280; }
      .add-rotina { margin-top: 0.75rem; }
      

      .toast { position: fixed; right: 2rem; top: 1.5rem; background: #2d8a34; color: #fff; padding: 0.75rem 1rem; border-radius: 6px; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; box-shadow: 0 8px 18px rgba(0,0,0,0.15); }
      .toast.visible { opacity: 1; }
      @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>Fichas de Pacientes</h1>
    <div class="toolbar">
      <button hx-get="{{ url_for('pacientes_novo') }}" hx-target="#paciente-form" hx-swap="outerHTML">Novo paciente</button>
      <span class="hint">Selecione um registro para visualizar e editar.</span>
    </div>
    <div class="layout">
      <section class="panel">
        <h2>Pacientes cadastrados</h2>
        <div id="pacientes-lista"
             hx-get="{{ url_for('pacientes_lista_partial') }}"
             hx-trigger="load, paciente-atualizado from:body"
             hx-swap="outerHTML">
          {% include 'pacientes/partials/lista.html' %}
        </div>
      </section>
      <section class="panel" id="paciente-form"
               hx-get="{{ url_for('pacientes_novo') }}"
               hx-trigger="load"
               hx-swap="outerHTML">
        <!-- Formulario carregado via HTMX -->
      </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
      document.body.addEventListener('paciente-atualizado', function (event) {
        const detail = event.detail || {};
        const toast = document.getElementById('toast');
        if (toast) {
          toast.textContent = detail.message || 'Ficha atualizada.';
          toast.classList.add('visible');
          window.setTimeout(() => toast.classList.remove('visible'), 4000);
        }
      });
    </script>
  </body>
</html>
