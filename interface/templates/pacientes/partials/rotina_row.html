<tr class="rotina-row">
  <td>
    <input type="text" name="rotinas-{{ indice }}-label" value="{{ rotina.label }}" placeholder="Descricao da pausa" required />
    <input type="hidden" name="rotinas-{{ indice }}-sort" value="{{ rotina.sort_order if rotina.sort_order is not none else indice }}" />
  </td>
  <td>
    <input type="time" name="rotinas-{{ indice }}-inicio" value="{{ rotina.inicio }}" required />
  </td>
  <td>
    <input type="number" min="1" max="720" name="rotinas-{{ indice }}-duracao" value="{{ rotina.duracao_min }}" required />
  </td>
  <td>
    <input type="text" name="rotinas-{{ indice }}-descricao" value="{{ rotina.descricao or '' }}" placeholder="Observacao opcional" />
  </td>
  <td class="center">
    <label class="toggle">
      <input type="checkbox" name="rotinas-{{ indice }}-ativo" value="1" {% if rotina.ativo %}checked{% endif %} />
      <span>Ativa</span>
    </label>
  </td>
  <td class="controls">
    <button type="button" class="secondary" onclick="this.closest('tr').remove()">Remover</button>
  </td>
</tr>
