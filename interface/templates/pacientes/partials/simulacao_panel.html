<fieldset>
  <legend>🎬 Gerar Dados Simulados</legend>
  
  <form hx-post="/pacientes/{{ paciente_id }}/simular"
        hx-target="#simulacao-resultado"
        hx-swap="outerHTML swap:1s"
        hx-indicator=".htmx-request #sim-loader">
    
    <div class="form-group" style="margin-bottom: 0.75rem;">
      <label for="sim_duracao" style="display: block; font-weight: 600; margin-bottom: 0.35rem;">
        ⏱️ Duração (horas):
      </label>
      <input type="number" 
             id="sim_duracao" 
             name="duracao_horas" 
             value="24" 
             min="1" 
             max="72" 
             required 
             style="width: 100%; padding: 0.5rem; border: 1px solid #ccd2da; border-radius: 4px; box-sizing: border-box;" />
      <small style="color: #555; display: block; margin-top: 0.25rem;">Mínimo 1h, máximo 72h (3 dias)</small>
    </div>
    
    <div class="form-group" style="margin-bottom: 0.75rem;">
      <label for="sim_seed" style="display: block; font-weight: 600; margin-bottom: 0.35rem;">
        🔑 Seed (opcional):
      </label>
      <input type="number" 
             id="sim_seed" 
             name="seed" 
             value="42"
             style="width: 100%; padding: 0.5rem; border: 1px solid #ccd2da; border-radius: 4px; box-sizing: border-box;" />
      <small style="color: #555; display: block; margin-top: 0.25rem;">Use para resultados reproduzíveis</small>
    </div>
    
    <div class="form-group" style="margin-bottom: 1rem;">
      <label for="sim_perfil" style="display: block; font-weight: 600; margin-bottom: 0.35rem;">
        📊 Perfil de Risco:
      </label>
      <select id="sim_perfil" 
              name="perfil"
              style="width: 100%; padding: 0.5rem; border: 1px solid #ccd2da; border-radius: 4px; box-sizing: border-box;">
        <option value="baixo">Baixo - Poucas transições de postura</option>
        <option value="medio" {% if perfil == "medio" %}selected{% endif %}>Médio - Transições regulares</option>
        <option value="alto">Alto - Muitas transições, maior risco</option>
      </select>
    </div>
    
    <div class="form-actions" style="display: flex; gap: 0.5rem; align-items: center;">
      <button type="submit" 
              style="background: #0066cc; color: #fff; border: none; border-radius: 4px; padding: 0.6rem 1rem; cursor: pointer; font-weight: 600;">
        ▶️ Simular
      </button>
      <span id="sim-loader" class="htmx-indicator" style="display: none;">
        <span style="color: #666;">⏳ Gerando dados...</span>
      </span>
    </div>
  </form>
  
  <div id="simulacao-resultado"></div>
</fieldset>
