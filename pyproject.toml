[tool.ruff]
# Alinhado com o Python do CI/Docker.
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Início permissivo e não-bloqueante (ver job "lint" no CI). Selecionamos o
# conjunto padrão do ruff (pyflakes + os erros de pycodestyle mais úteis), que
# aponta defeitos reais — import não usado (F401), nome indefinido (F821),
# redefinição (F811), bare-except (E722) — sem inundar com ruído estilístico.
# A limpeza dessas violações é um follow-up separado; por ora o lint é
# advisory, para dar visibilidade sem travar o merge.
select = ["E4", "E7", "E9", "F"]
