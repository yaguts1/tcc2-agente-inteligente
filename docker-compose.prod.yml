services:
  app:
    build: .
    container_name: tcc_app
    restart: always
    environment:
      - MODE=stream
      - REDIS_URL=redis://redis:6379/0
      - APP_PREFIX=/TCC
      - UPP_DB_PATH=/data/dados.db
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tcc_redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  app_data:
