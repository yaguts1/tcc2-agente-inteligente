; Build do firmware ESP32.
;
; Por que existe
; --------------
; O firmware era a única parte do sistema sem verificação nenhuma: não havia
; toolchain no fluxo, então mudanças iam para o repositório sem nunca terem
; passado por um compilador. Foi assim que o sketch chegou a um estado em que
; NÃO COMPILAVA (dois `.ino` na mesma pasta, com `setup()` e `loop()`
; duplicados) sem que nada acusasse.
;
; Uso local:
;   pio run -d firmware                  # compila as duas variantes
;   pio run -d firmware -e websocket     # só a WebSocket
;   pio test -d firmware -e nativo       # testes da lógica pura, sem hardware
;
; A CI roda o mesmo (ver .github/workflows/python-tests.yml).

[platformio]
src_dir = esp32_replay
; O padrão do `data_dir` é `$PROJECT_DIR/data` — ou seja, `firmware/data`, que
; não existe. Sem esta linha, `pio run -t uploadfs` sobe um SPIFFS VAZIO, e o
; firmware falha em `abrirArquivoEventos` com "Nao foi possivel abrir
; /eventos.jsonl". O `data/` de verdade mora junto do sketch, porque é de lá
; que a Arduino IDE o lê ("ESP32 Sketch Data Upload").
data_dir = esp32_replay/data
; `pio run` compila só os alvos de firmware. O ambiente `nativo` existe para
; `pio test` e precisa de um gcc do HOST — incluí-lo aqui faria `pio run`
; falhar em máquina sem compilador C++ instalado (Windows, tipicamente).
default_envs = http, websocket
; `pio test` procura aqui; mantém os testes fora da pasta do sketch para o
; Arduino não tentar compilá-los junto.
test_dir = test

; Base dos alvos ESP32. NÃO usar `[env]`: o que estiver lá vale também para o
; ambiente `nativo`, que não tem placa nem framework Arduino — foi assim que a
; primeira tentativa de rodar os testes falhou com "Unknown board ID esp32dev".
[esp32_base]
platform = espressif32@^6.4.0
board = esp32dev
framework = arduino
; ArduinoJson 6: o código usa `StaticJsonDocument`/`DynamicJsonDocument`, que a
; v7 removeu. Fixado para a atualização da lib não quebrar o build em silêncio.
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    links2004/WebSockets@^2.4.1
; `config.h` é git-ignored (tem credenciais). Sem ele o build falha, então o
; script cria uma cópia do exemplo quando não existe — o suficiente para
; compilar, nunca para gravar num dispositivo real.
extra_scripts = pre:scripts_build/preparar_config.py

; O transporte é escolhido por flag de build, e não editando `config.h`: assim a
; CI compila AS DUAS variantes a cada push. Era exatamente a divergência entre
; elas que deixou a versão recomendada cinco correções atrás da outra.
[env:http]
extends = esp32_base
build_flags = -Werror=return-type

[env:websocket]
extends = esp32_base
build_flags = -DUSAR_WEBSOCKET -Werror=return-type

; Testes da lógica pura (parse de timestamp, backoff, classificação de resposta)
; rodando na máquina, sem ESP32. Não cobre rede nem SPIFFS, mas é a parte com
; regra de negócio — e era a parte sem nenhum teste.
; Não estende `esp32_base`: roda na máquina, sem placa e sem Arduino.
[env:nativo]
platform = native
build_flags = -std=gnu++17 -DUNIT_TEST
test_framework = unity
